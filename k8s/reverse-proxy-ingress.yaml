# Public entry for defidb.online (HTTPS + HTTP->HTTPS redirect) via k3s Traefik.
# Exported from the live cluster (namespace defi) on 2026-11-03.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: defi
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reverse-proxy
  namespace: defi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: defidb.online
    http:
      paths:
      - backend:
          service:
            name: reverse-proxy
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - defidb.online
    secretName: defidb-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reverse-proxy-http-redirect
  namespace: defi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: defi-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: defidb.online
    http:
      paths:
      - backend:
          service:
            name: reverse-proxy
            port:
              number: 80
        path: /
        pathType: Prefix
